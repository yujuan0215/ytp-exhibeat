services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ytp-exhibeat-backend
    ports:
      - "8000:8000" # API Proxy (前端會叫這個)
      - "8001:8001" # ADK Web UI（可選，用來直接測 agent）
    env_file:
      - backend/adk_agent/gemini_agent/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ytp-exhibeat-frontend
    ports:
      - "5173:5173"
    environment:
      # 容器內 vite 要呼叫 backend 容器
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
